<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeUcuzluk Aktüel İndirim Kataloğu</title>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>

    <!-- Üst Yönetim Navigasyonu -->
    <header class="admin-header">
        <div class="header-content">
            <span class="brand-title"><span style="color:#e50914">Home</span><span style="color:#004aad">Ucuzluk</span></span>
            <div class="nav-buttons">
                <button onclick="switchTab('catalog')">📖 Aktüel İnsert Kataloğu</button>
                <button onclick="switchTab('products')">🛍️ Tekil Ürünler</button>
                <button onclick="toggleAdminPanel()" class="admin-btn">⚙️ Yönetim Paneli</button>
            </div>
        </div>
    </header>

    <main class="main-container">

        <!-- YÖNETİM PANELİ (ŞİFRELİ: 14531453) -->
        <section id="admin-panel" class="card hidden">
            <h2>➕ Yeni İnsert / Ürün Ekle</h2>
            <form id="add-product-form">
                
                <div class="form-group">
                    <label>Görsel Yükle (Otomatik Metin Okuma):</label>
                    <input type="file" id="image-input" accept="image/*" required>
                    <small id="ocr-status"></small>
                </div>

                <div id="image-preview-container" class="hidden" style="margin-bottom: 1rem;">
                    <img id="image-preview" src="" alt="Önizleme" style="max-height: 150px; border-radius: 8px;">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ürün / İnsert Adı:</label>
                        <input type="text" id="title-input" placeholder="Örn: Paşabahçe Borcam Seti" required>
                    </div>

                    <div class="form-group">
                        <label>Fiyat (TL):</label>
                        <input type="number" id="price-input" placeholder="199.90" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ürün Açıklaması / Özellikleri:</label>
                    <textarea id="desc-input" rows="3" placeholder="Ürün özelliklerini girin..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kargo Durumu:</label>
                        <select id="shipping-input">
                            <option value="Kargo Alıcıya Ait">Kargo Alıcıya Ait</option>
                            <option value="Ücretsiz Kargo">Ücretsiz Kargo (Satıcıya Ait)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Yayın Tipi:</label>
                        <select id="type-input">
                            <option value="insert">Market İnsert Kataloğu Görseli</option>
                            <option value="single">Tekil Ürün Paylaşımı</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Katalog Başlangıç Tarihi:</label>
                        <input type="date" id="start-date-input" required>
                    </div>
                    <div class="form-group">
                        <label>Son Geçerlilik (Silinme) Tarihi:</label>
                        <input type="date" id="expiry-input" required>
                    </div>
                </div>

                <button type="submit" class="primary-btn">Sisteme Kaydet ve Yayınla</button>
            </form>

            <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ddd;">
            
            <h3>📋 Yüklenen Ürünler & Manuel Silme</h3>
            <div id="admin-product-list"></div>
        </section>


        <!-- SİZİN HAZIRLADIĞINIZ CANLI KATALOG ŞABLONU -->
        <section id="catalog-section">
            <div class="katalog-container">
                
                <header class="katalog-header">
                    <div class="logo-container">
                        <h1 class="logo-text"><span class="home">Home</span><span class="ucuzluk">Ucuzluk</span></h1>
                    </div>
                    <div>
                        <div class="aktuel-serit">AKTÜEL İNDİRİM KATALOĞU</div>
                    </div>
                    <div>
                        <div class="firsat-serit">Alışverişe Değer Fırsatlar</div>
                    </div>
                    <div class="dinamik-tarih-alani">
                        <span id="baslangic-tarihi">Tarih Belirtilmedi</span> - <span id="bitis-tarihi">Tarih Belirtilmedi</span> Tarihleri Arasında Geçerlidir
                    </div>
                </header>

                <div class="carousel-wrapper">
                    <div class="carousel-slides" id="carouselSlides">
                        <div class="slide">
                            <div class="bos-alan-yazisi">
                                <i class="fa-regular fa-images" style="font-size: 36px; display:block; margin-bottom:8px;"></i>
                                Henüz Yüklenmiş Katalog Sayfası Yok
                            </div>
                        </div>
                    </div>

                    <button class="nav-button sol-ok" onclick="sayfaDegistir(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="nav-button sag-ok" onclick="sayfaDegistir(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <div class="noktalar-kutusu" id="noktalarKutusu"></div>

                <footer class="katalog-footer">
                    <a href="https://instagram.com/homeucuzluk" target="_blank" class="instagram-buton">
                        <i class="fa-brands fa-instagram"></i> homeucuzluk
                    </a>
                </footer>
            </div>
        </section>


        <!-- TEKİL ÜRÜNLER ALANI -->
        <section id="products-section" class="hidden">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: #004aad;">🛍️ Tekil Ürünler & Sipariş Verme</h2>
            <div id="product-grid" class="product-grid"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
