<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeUcuzluk - İnsert ve Ürün Kataloğu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tesseract.js (Görsel Metin Okuma Kütüphanesi) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <h1>HomeUcuzluk</h1>
            <span>Fırsat Ürünleri & Aktüel Katalog</span>
        </div>
        <nav>
            <button onclick="switchTab('catalog')">🛒 Aktüel İnsertler</button>
            <button onclick="switchTab('products')">📦 Tekil Ürünler</button>
            <button onclick="toggleAdminPanel()" class="admin-btn">⚙️ Yönetim Paneli</button>
        </nav>
    </header>

    <main class="container">
        
        <!-- YÖNETİM PANELİ -->
        <section id="admin-panel" class="card hidden">
            <h2>➕ Ürün veya Çoklu İnsert Ekle</h2>
            <form id="add-product-form">
                
                <div class="form-group">
                    <label>Görsel Yükle (Otomatik Tarama):</label>
                    <input type="file" id="image-input" accept="image/*" required>
                    <small id="ocr-status">Görsel seçildiğinde metinler taranacaktır...</small>
                </div>

                <div id="image-preview-container" class="hidden">
                    <img id="image-preview" src="" alt="Önizleme">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ürün / İnsert Adı:</label>
                        <input type="text" id="title-input" placeholder="Örn: Paşabahçe Borcam Seti" required>
                    </div>

                    <div class="form-group">
                        <label>Fiyat (TL):</label>
                        <input type="number" id="price-input" placeholder="199.90" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ürün Açıklaması / Çoklu Ürün Listesi:</label>
                    <textarea id="desc-input" rows="3" placeholder="Ürün detaylarını veya çoklu ürün listesini girin..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kargo Durumu:</label>
                        <select id="shipping-input">
                            <option value="Kargo Alıcıya Ait">Kargo Alıcıya Ait</option>
                            <option value="Ücretsiz Kargo (Satıcıya Ait)">Ücretsiz Kargo (Satıcıya Ait)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Yayın Tipi (Görünüm):</label>
                        <select id="type-input">
                            <option value="single">Tekil Ürün Paylaşımı</option>
                            <option value="insert">Market İnsertü / Çoklu Katalog</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Yayın Bitiş Tarihi (Otomatik Kaldırılır):</label>
                        <input type="date" id="expiry-input" required>
                    </div>
                </div>

                <button type="submit" class="primary-btn">Sisteme Ekle ve Yayınla</button>
            </form>

            <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ddd;">
            
            <h3>📋 Eklenen Ürünleri Yönet / Erken Sil</h3>
            <div id="admin-product-list" class="admin-list"></div>
        </section>

        <!-- İNSERT / KATALOG VİTRİNİ -->
        <section id="catalog-section">
            <h2>🔥 Aktüel İnsertler ve Çoklu Kataloglar</h2>
            <div id="insert-grid" class="grid"></div>
        </section>

        <!-- TEKİL ÜRÜNLER VİTRİNİ -->
        <section id="products-section" class="hidden">
            <h2>🛍️ Tekil Ürün Paylaşımları</h2>
            <div id="product-grid" class="grid"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
