<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeUcuzluk - Aktüel Katalog & Ürünler</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <h1>HomeUcuzluk</h1>
            <span>Fırsat Ürünleri & Aktüel Katalog</span>
        </div>
        <nav>
            <button onclick="switchTab('catalog')">📖 Aktüel İnsert Kataloğu</button>
            <button onclick="switchTab('products')">🛍️ Tekil Ürünler</button>
            <button onclick="toggleAdminPanel()" class="admin-btn">⚙️ Yönetim Paneli</button>
        </nav>
    </header>

    <main class="container">
        
        <!-- YÖNETİM PANELİ -->
        <section id="admin-panel" class="card hidden">
            <h2>➕ Yeni İnsert / Ürün Ekle</h2>
            <form id="add-product-form">
                
                <div class="form-group">
                    <label>Görsel Yükle (Otomatik Metin Okuma):</label>
                    <input type="file" id="image-input" accept="image/*" required>
                    <small id="ocr-status" style="color: #666; font-weight: bold; margin-top: 5px;"></small>
                </div>

                <div id="image-preview-container" class="hidden" style="margin-bottom: 1rem;">
                    <img id="image-preview" src="" alt="Önizleme" style="max-height: 200px; border-radius: 6px;">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ürün / İnsert Adı:</label>
                        <input type="text" id="title-input" placeholder="Örn: Paşabahçe Borcam Seti" required>
                    </div>

                    <div class="form-group">
                        <label>Fiyat (TL):</label>
                        <input type="number" id="price-input" placeholder="199.90" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ürün Açıklaması / Detaylar:</label>
                    <textarea id="desc-input" rows="3" placeholder="Ürün özelliklerini girin..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kargo Durumu:</label>
                        <select id="shipping-input">
                            <option value="Kargo Alıcıya Ait">Kargo Alıcıya Ait</option>
                            <option value="Ücretsiz Kargo">Ücretsiz Kargo (Satıcıya Ait)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Yayın Tipi:</label>
                        <select id="type-input">
                            <option value="insert">Market İnsert Kataloğu Görseli</option>
                            <option value="single">Tekil Ürün Kartı</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Katalog / Ürün Başlangıç Tarihi:</label>
                        <input type="date" id="start-date-input" required>
                    </div>
                    <div class="form-group">
                        <label>Son Geçerlilik (Silinme) Tarihi:</label>
                        <input type="date" id="expiry-input" required>
                    </div>
                </div>

                <button type="submit" class="primary-btn">Sisteme Kaydet ve Yayınla</button>
            </form>

            <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ddd;">
            
            <h3>📋 Aktif Ürün/İnsert Yönetimi (Erken Silme)</h3>
            <div id="admin-product-list"></div>
        </section>

        <!-- AKTÜEL İNSERT KATALOĞU (Grosper Tarzı Broşür) -->
        <section id="catalog-section">
            <div class="catalog-banner">
                <div class="brand-header">
                    <h2>HOMEUCUZLUK</h2>
                    <p class="tagline">HomeUcuzluk ile Alışverişte Fırsatlar!</p>
                </div>
                <div class="catalog-badge">AKTÜEL İNDİRİM KATALOĞU</div>
                <div id="catalog-date-range" class="catalog-date">Güncel Fırsat Katalogları</div>
            </div>

            <!-- Kaydırmalı Broşür Alanı -->
            <div id="insert-carousel" class="carousel-container">
                <!-- Dinamik broşür sayfaları yüklenecek -->
            </div>
        </section>

        <!-- TEKİL ÜRÜNLER VİTRİNİ -->
        <section id="products-section" class="hidden">
            <h2>🛍️ Tekil Ürünler & Sipariş Oluşturma</h2>
            <div id="product-grid" class="grid"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
