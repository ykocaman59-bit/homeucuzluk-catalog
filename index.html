<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeUcuzluk</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <h1>HomeUcuzluk</h1>
            <p>İndirimli Ürün Kataloğu</p>
        </div>
        <button id="auth-btn" onclick="handleAuthAction()" class="admin-toggle-btn">⚙️ Yönetim Paneli</button>
    </header>

    <!-- Yönetim Paneli -->
    <section id="admin-panel" class="admin-section hidden">
        <div class="admin-card">
            <div class="admin-card-header">
                <h2>📦 Yeni Ürün / Katalog Ekle</h2>
                <button onclick="logoutAdmin()" class="logout-btn">Çıkış Yap</button>
            </div>
            
            <form id="add-product-form">
                <div class="form-group">
                    <label>Ekleme Türü:</label>
                    <select id="type-input" onchange="toggleDateFields()">
                        <option value="insert">Broşür / Katalog Sayfası</option>
                        <option value="single">Tekil Ürün Kartı</option>
                    </select>
                </div>

                <div id="date-fields" class="form-row">
                    <div class="form-group half">
                        <label>Başlangıç Tarihi:</label>
                        <input type="date" id="start-date-input">
                    </div>
                    <div class="form-group half">
                        <label>Bitiş Tarihi:</label>
                        <input type="date" id="expiry-input">
                    </div>
                </div>

                <div class="form-group">
                    <label>Ürün Görseli:</label>
                    <input type="file" id="image-input" accept="image/*" required>
                    <span id="ocr-status" class="status-text"></span>
                </div>

                <div id="image-preview-container" class="preview-box hidden">
                    <img id="image-preview" src="" alt="Önizleme">
                </div>

                <div class="form-group">
                    <label>Ürün Başlığı:</label>
                    <input type="text" id="title-input" placeholder="Ürün adı" required>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label>Fiyat (₺):</label>
                        <input type="text" id="price-input" placeholder="149.90" required>
                    </div>
                    <div class="form-group half">
                        <label>Durum:</label>
                        <select id="condition-input">
                            <option value="Sıfır">Sıfır</option>
                            <option value="İkinci El">İkinci El</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Kargo Bilgisi:</label>
                    <select id="shipping-input">
                        <option value="Ücretsiz Kargo">Ücretsiz Kargo</option>
                        <option value="Alıcı Öder">Alıcı Öder Kargo</option>
                        <option value="Mağazadan Teslim">Mağazadan Teslim</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Açıklama:</label>
                    <textarea id="desc-input" rows="3" placeholder="Ürün detayları..."></textarea>
                </div>

                <button type="submit" class="save-btn">💾 Kaydet</button>
            </form>

            <hr style="margin: 20px 0;">
            <h3>🗑️ Ürün Listesi</h3>
            <div id="admin-product-list"></div>
        </div>
    </section>

    <!-- Menü Sekmeleri -->
    <nav class="tab-navigation">
        <button class="nav-tab active" onclick="switchTab('catalog')">📅 Fırsat Kataloğu</button>
        <button class="nav-tab" onclick="switchTab('products')">🛍️ Tüm Ürünler</button>
    </nav>

    <!-- KATALOG ALANI -->
    <main id="catalog-section" class="content-container">
        <div id="catalog-tabs" class="catalog-tabs-wrapper"></div>

        <div class="carousel-card">
            <div class="carousel-info-bar">
                <span>📅 Geçerlilik: <b id="baslangic-tarihi">-</b> / <b id="bitis-tarihi">-</b></span>
            </div>

            <div class="carousel-container">
                <button class="carousel-btn prev-btn" onclick="sayfaDegistir(-1)">❮</button>
                <div class="carousel-track-wrapper">
                    <div id="carouselSlides" class="carousel-track"></div>
                </div>
                <button class="carousel-btn next-btn" onclick="sayfaDegistir(1)">❯</button>
            </div>

            <div id="noktalarKutusu" class="carousel-dots"></div>
        </div>

        <!-- KATALOG ALTINDAKİ DM İLE SİPARİŞ VERME ÜRÜN KARTLARI -->
        <div style="margin-top:30px;">
            <h3 style="margin-bottom:15px; color:#333;">🏷️ Kataloğa Ait Ürünler</h3>
            <div id="catalog-product-grid" class="product-grid"></div>
        </div>
    </main>

    <!-- TEKİL ÜRÜNLER ALANI -->
    <main id="products-section" class="content-container hidden">
        <div id="product-grid" class="product-grid"></div>
    </main>

    <footer class="main-footer">
        <p>© HomeUcuzluk - Instagram: <a href="https://www.instagram.com/homeucuzluk/" target="_blank">@homeucuzluk</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
